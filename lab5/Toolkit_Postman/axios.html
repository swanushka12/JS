<!DOCTYPE html>
<html>
<head>
  <title>Axios</title>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
  <script>
    // GET запросы для браузера 
    axios.get("https://vk.com");
    .then(response => 
    {
        console.log("Успех:", response.status);
    })
    .catch(error => 
    {
        console.error("Ошибка:", error.message);
    });
    // Ошибка Access to XMLHttpRequest has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present on the requested resource 
    // Ошибка запроса CORS, так как vk не дает доступ к ресурсам с других доменов и не разрешает запросы с любого источника - Access-Control-Allow-Origin 

    axios.get('https://json.geoiplookup.io/');
    .then(response => 
    {
        console.log("Успех:", response.status);
    })
    .catch(error => 
    {
        console.error("Ошибка:", error.message);
    });
    // Успех: 200
  </script>
</body>
</html>
